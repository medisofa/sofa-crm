name: SOFA Migrations · security_invoker guard

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**/*.sql"
      - ".github/workflows/migrations-view-security-ci.yml"
  pull_request:
    paths:
      - "supabase/migrations/**/*.sql"
      - ".github/workflows/migrations-view-security-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toda vista pública nueva o recreada debe llevar security_invoker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-view-security-invoker.js
