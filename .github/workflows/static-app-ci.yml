name: SOFA Static App CI

on:
  push:
    branches: ["main", "architecture/mvp-production-v1"]
    paths:
      - "js/**/*.js"
      - ".github/workflows/static-app-ci.yml"
  pull_request:
    paths:
      - "js/**/*.js"
      - ".github/workflows/static-app-ci.yml"

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate dashboard module integrity
        run: |
          node --check js/modules/dashboard-rol.js
          node -e "const fs=require('fs');const s=fs.readFileSync('js/modules/dashboard-rol.js','utf8');if((s.match(/export async function render/g)||[]).length!==1)process.exit(1);if(!s.includes('const KPI_ROUTE'))process.exit(1);"
      - name: Validate auto-training wiring
        run: |
          grep -q "'autoentrenamiento': 'autoentrenamiento.js'" js/router.js
          grep -q "route: 'autoentrenamiento'" js/utils/permissions.js
          grep -q "export const accionesDelRol" js/utils/permissions.js
          grep -q "async function render" js/modules/autoentrenamiento.js
