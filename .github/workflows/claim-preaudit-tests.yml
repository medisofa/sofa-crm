name: SOFA Claims Preaudit
on:
  pull_request:
    paths:
      - 'js/services/claim-audit-agents.js'
      - 'js/services/claim-agent-runner.js'
      - 'js/modules/claim.js'
      - 'tests/claim-audit-agents.test.mjs'
      - '.github/workflows/claim-preaudit-tests.yml'
  push:
    branches: [feature/claim-audit-agents-safe]
    paths:
      - 'js/services/claim-audit-agents.js'
      - 'js/services/claim-agent-runner.js'
      - 'js/modules/claim.js'
      - 'tests/claim-audit-agents.test.mjs'
      - '.github/workflows/claim-preaudit-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --experimental-default-type=module --check js/services/claim-audit-agents.js
          node --experimental-default-type=module --check js/services/claim-agent-runner.js
          node --experimental-default-type=module --check js/modules/claim.js
      - name: Synthetic preaudit regression
        run: node --experimental-default-type=module --test tests/claim-audit-agents.test.mjs
