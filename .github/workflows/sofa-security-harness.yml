name: SOFA security harness (synthetic)
on:
  push:
    branches: [feature/gmail-oauth-staging]
    paths:
      - 'tests/security/**'
      - '.github/workflows/sofa-security-harness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jwt-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'PyJWT[crypto]>=2.8,<3' 'cryptography>=42' 'psycopg[binary]>=3.1,<4' 'pytest>=8,<10'
      - name: Run synthetic JWT and gateway tests (no DB credentials)
        run: python -m pytest -q tests/security/test_jwt_http_harness.py tests/security/test_jwt_neon_gateway.py
